<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>DietMath - Weight Chart</title>
	<style>
		body{font-family:ui-monospace,Menlo,Consolas,monospace;margin:24px;color:#111;background:#fafafa;}
		.card{padding:16px;border:1px solid #ddd;border-radius:8px;background:#fff;}
		.chart-wrap{position:relative;}
		.chart{width:100%;height:260px;border:1px solid #ddd;border-radius:8px;background:#fff;display:block;}
		.tooltip{position:absolute;pointer-events:none;background:#111;color:#fff;padding:6px 8px;border-radius:6px;
			font-size:12px;transform:translate(-50%,-110%);opacity:0;transition:opacity .1s ease;}
		.tooltip strong{display:block;font-size:12px;}
		.records{width:100%;margin-top:16px;border-collapse:collapse;font-size:14px;}
		.records th,.records td{padding:8px 10px;border-bottom:1px solid #eee;text-align:left;}
		.records th{background:#fafafa;}
		.controls{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;}
		label{display:block;margin:10px 0 4px;}
		input{padding:8px;border:1px solid #bbb;border-radius:6px;}
		button{padding:10px 16px;border:0;border-radius:6px;background:#111;color:#fff;}
		.meta{color:#555;margin-top:6px;}
		.note{color:#8a4b08;margin-top:8px;}
		a{color:#111;}
	</style>
</head>
<body>
	<p><a href="/user">Back to user</a></p>
	<div class="card">
		<h1>Weight chart for <span th:text="${username}">user</span></h1>
		<form method="get" action="/user/weights" class="controls">
			<div>
				<label for="from">Show from</label>
				<input id="from" name="from" type="date" th:value="${fromDate}">
			</div>
			<div>
				<button type="submit">Update</button>
			</div>
			<div class="meta">
				<span th:text="'Entries: ' + ${entryCount}">Entries: 0</span>
			</div>
		</form>
		<p class="note" th:if="${note != ''}" th:text="${note}"></p>

		<div th:if="${hasPoints}">
			<div class="chart-wrap">
				<svg class="chart" id="weightChart" viewBox="0 0 600 260" preserveAspectRatio="none">
					<g id="weightGrid"></g>
					<g id="weightAxes"></g>
					<polyline id="weightLine" fill="none" stroke="#111" stroke-width="2" points=""></polyline>
					<g id="weightPoints"></g>
				</svg>
				<div class="tooltip" id="weightTooltip"></div>
			</div>
			<table class="records">
				<thead>
					<tr>
						<th>Date</th>
						<th>Weight (kg)</th>
					</tr>
				</thead>
				<tbody>
					<tr th:each="record : ${weightRecords}">
						<td th:text="${record.date}">2025-01-01</td>
						<td th:text="${record.weight}">70.2</td>
					</tr>
				</tbody>
			</table>
		</div>
		<div th:if="${!hasPoints}">
			<p>No weight entries in this range.</p>
		</div>
	</div>

	<script th:inline="javascript">
	/*<![CDATA[*/
	const points = /*[[${chartPoints}]]*/ [];
	const fromDate = /*[[${fromDate}]]*/ null;
	const toDate = /*[[${toDate}]]*/ null;
	const svg = document.getElementById('weightChart');
	const line = document.getElementById('weightLine');
	const dots = document.getElementById('weightPoints');
	const grid = document.getElementById('weightGrid');
	const axes = document.getElementById('weightAxes');
	const tooltip = document.getElementById('weightTooltip');

	if (svg && points.length > 0) {
		const width = 600;
		const height = 260;
		const padding = 36;
		const start = new Date(fromDate + 'T00:00:00');
		const end = new Date(toDate + 'T23:59:59');
		const timespan = Math.max(1, end.getTime() - start.getTime());

		let min = points[0].weight;
		let max = points[0].weight;
		for (const p of points) {
			min = Math.min(min, p.weight);
			max = Math.max(max, p.weight);
		}
		if (min === max) {
			min -= 1;
			max += 1;
		}

		const coords = points.map(p => {
			const date = new Date(p.date + 'T00:00:00');
			const x = padding + ((date.getTime() - start.getTime()) / timespan) * (width - padding * 2);
			const y = height - padding - ((p.weight - min) / (max - min)) * (height - padding * 2);
			return { x, y, date: p.date, weight: p.weight };
		});

		line.setAttribute('points', coords.map(p => `${p.x},${p.y}`).join(' '));

		const gridLines = 4;
		for (let i = 0; i <= gridLines; i++) {
			const y = padding + ((height - padding * 2) / gridLines) * i;
			const lineEl = document.createElementNS('http://www.w3.org/2000/svg', 'line');
			lineEl.setAttribute('x1', padding);
			lineEl.setAttribute('x2', width - padding);
			lineEl.setAttribute('y1', y);
			lineEl.setAttribute('y2', y);
			lineEl.setAttribute('stroke', '#eee');
			grid.appendChild(lineEl);
		}

		const yLabels = [
			{ value: max, y: padding },
			{ value: (min + max) / 2, y: padding + (height - padding * 2) / 2 },
			{ value: min, y: height - padding }
		];
		for (const label of yLabels) {
			const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
			text.setAttribute('x', 6);
			text.setAttribute('y', label.y + 4);
			text.setAttribute('fill', '#666');
			text.setAttribute('font-size', '11');
			text.textContent = label.value.toFixed(1);
			axes.appendChild(text);
		}

		const xStart = document.createElementNS('http://www.w3.org/2000/svg', 'text');
		xStart.setAttribute('x', padding);
		xStart.setAttribute('y', height - 6);
		xStart.setAttribute('fill', '#666');
		xStart.setAttribute('font-size', '11');
		xStart.textContent = fromDate;
		axes.appendChild(xStart);

		const xEnd = document.createElementNS('http://www.w3.org/2000/svg', 'text');
		xEnd.setAttribute('x', width - padding);
		xEnd.setAttribute('y', height - 6);
		xEnd.setAttribute('fill', '#666');
		xEnd.setAttribute('font-size', '11');
		xEnd.setAttribute('text-anchor', 'end');
		xEnd.textContent = toDate;
		axes.appendChild(xEnd);

		for (const point of coords) {
			const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
			circle.setAttribute('cx', point.x);
			circle.setAttribute('cy', point.y);
			circle.setAttribute('r', 3);
			circle.setAttribute('fill', '#111');
			dots.appendChild(circle);
		}

		const overlay = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
		overlay.setAttribute('x', padding);
		overlay.setAttribute('y', padding);
		overlay.setAttribute('width', width - padding * 2);
		overlay.setAttribute('height', height - padding * 2);
		overlay.setAttribute('fill', 'transparent');
		svg.appendChild(overlay);

		const showTooltip = (point) => {
			if (!tooltip) {
				return;
			}
			tooltip.innerHTML = `<strong>${point.weight.toFixed(1)} kg</strong>${point.date}`;
			tooltip.style.opacity = '1';
			tooltip.style.left = `${(point.x / width) * 100}%`;
			tooltip.style.top = `${(point.y / height) * 100}%`;
		};

		const hideTooltip = () => {
			if (!tooltip) {
				return;
			}
			tooltip.style.opacity = '0';
		};

		overlay.addEventListener('mousemove', (event) => {
			const rect = svg.getBoundingClientRect();
			const mouseX = ((event.clientX - rect.left) / rect.width) * width;
			let closest = coords[0];
			let minDistance = Math.abs(coords[0].x - mouseX);
			for (const point of coords) {
				const dist = Math.abs(point.x - mouseX);
				if (dist < minDistance) {
					minDistance = dist;
					closest = point;
				}
			}
			showTooltip(closest);
		});
		overlay.addEventListener('mouseleave', hideTooltip);
	}
	/*]]>*/
	</script>
</body>
</html>
